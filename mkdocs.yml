site_name: Seguidor de Linha

repo_url: https://github.com/team-titans-unb/p_seguidor
repo_name: repo-seguidor
site_description: "Documentação do seguidor de linha"

nav:
  - Home: index.md

  - Hammer-S:
    - Visão geral: pages/stm1Stm2/index.md
    - Mecânica: pages/stm1Stm2/mec.md
    - Eletrônica: pages/stm1Stm2/eletr.md
    - Controle: pages/stm1Stm2/contro.md

  - Besourineo:
    - Visão geral: pages/stm3/index.md
    - Mecânica: pages/stm3/mec.md
    - Eletrônica: pages/stm3/eletr.md
    - Controle: pages/stm3/contro.md

  - Azzip:
    - Visão geral: pages/azzip/index.md
    - Mecânica: pages/azzip/mec.md
    - Eletrônica: pages/azzip/eletr.md
    - Controle: pages/azzip/contro.md
    - Software: pages/azzip/soft.md

  - Descontinuados:
    - Sobre: pages/descontinuados/index.md
    - Sucrilho:
      - Mecânica: pages/paoDeQueijo/mec.md
      - Eletrônica: pages/paoDeQueijo/eletr.md
      - Controle: pages/paoDeQueijo/contro.md

theme:
  name: material
  language: pt-BR

  features:
    - content.code.annotate
    - content.tabs.link
    - navigation.tabs
    - navigation.indexes
    - header.autohide
    - navigation.instant
    - navigation.top
    - navigation.tracking
  
  palette:

    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb-outline
        name: Mude para o tema escuro
        
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb
        name: Mude para o tema claro

  
  logo: assets/titans.png
  favicon: assets/titansIco.ico
  highlightjs: true

extra_css:
  - overrides/styles.css

markdown_extensions:
    - admonition
    - attr_list
    - md_in_html
    - tables
    - pymdownx.details
    - pymdownx.superfences
